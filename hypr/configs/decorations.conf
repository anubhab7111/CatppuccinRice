#####################
### LOOK AND FEEL ###
#####################
# Refer to https://wiki.hyprland.org/Configuring/Variables/

# ================================
# GENERAL APPEARANCE
# ================================
general {
    gaps_in = 12
    gaps_out = 25
    border_size = 5

    col.active_border = 0xffcba6f7 0xfffab387 45deg
    col.inactive_border = 0xff313244 0xff45475a 90deg

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

# ================================
# DECORATIONS & EFFECTS
# ================================
decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = true
        range = 20
        render_power = 4
        color = rgba(0, 0, 0, 0.6)
    }
    blur {
        enabled = true
        size = 4
        passes = 2
        noise = 0.017
        contrast = 0.9
        brightness = 0.85
        vibrancy = 0.3
        vibrancy_darkness = 0.2
        ignore_opacity = true
    }
}

