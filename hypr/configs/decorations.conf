# smooth animations
animations {
    enabled = 1

    bezier = fluent, 0.215, 0.61, 0.355, 1
    bezier = fluentFast, 0.4, 0.0, 0.6, 1.0
    bezier = winInSmooth, 0.25, 1.0, 0.5, 1.0
    bezier = winOutSmooth, 0.5, 0.0, 1.0, 0.75
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 6, fluentFast, slide
    animation = windowsIn, 1, 6, winInSmooth, slide
    animation = windowsOut, 1, 5, winOutSmooth, slide
    animation = windowsMove, 1, 6, fluentFast, slide

    animation = border, 1, 1, liner
    animation = borderangle, 1, 45, liner, loop

    animation = fade, 1, 8, fluentFast

    animation = workspaces, 1, 6, fluentFast
}


# ================================
# LAYOUT SETTINGS
# ================================
# Dwindle layout configuration
dwindle {
    pseudotile = true           # Master switch for pseudotiling
    preserve_split = true       # Maintain split ratios when opening new windows
}

# Master layout configuration
master {
    new_status = master
}

# ================================
# MISCELLANEOUS
# ================================
misc {
    force_default_wallpaper = -1    # Disable anime mascot wallpapers
    disable_hyprland_logo = true    # Disable random hyprland logo background
        mouse_move_enables_dpms = true
    enable_swallow = true
    swallow_regex = ^(alacritty|kitty|footclient)$
    vfr = false  # Disable variable refresh rate
    vrr = 0      # Disable VRR completely
}

#############
### INPUT ###
#############

# ================================
# KEYBOARD & MOUSE
# ================================
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    repeat_rate = 25
    repeat_delay = 600
    sensitivity = 0             # -1.0 to 1.0, 0 means no modification

    touchpad {
        natural_scroll = false
    }
}

# ================================
# DEVICE-SPECIFIC SETTINGS
# ================================
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# ================================
# GESTURES & CURSOR
# ================================
# gestures {
    # workspace_swipe = true
    # workspace_swipe_fingers = 3
# }

cursor {
    no_hardware_cursors = true
}
