#####################
### LOOK AND FEEL ###
#####################

# ================================
# GENERAL APPEARANCE
# ================================
general {
    gaps_in = 10
    gaps_out = 20
    border_size = 3

    col.active_border = 0xffcba6f7 0xfffab387 90deg
    col.inactive_border = 0xff45475a 0xff313244 90deg

    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
    allow_tearing = false
    layout = dwindle
}

# ================================
# DECORATIONS & EFFECTS
# ================================
decoration {
    rounding = 16
    active_opacity = 1.0
    inactive_opacity = 0.95
    fullscreen_opacity = 1.0

    dim_inactive = true
    dim_strength = 0.08
    dim_special = 0.5

    blur {
        enabled = true
        size = 6
        passes = 3
        ignore_opacity = true
        new_optimizations = true
        xray = false
        noise = 0.02
        contrast = 0.95
        brightness = 0.9
        vibrancy = 0.2
        vibrancy_darkness = 0.3
        popups = true
        popups_ignorealpha = 0.6
    }
}

# ================================
# ANIMATIONS - Ultra Smooth
# ================================
animations {
    enabled = true
    # first_launch_animation = true

    # Custom bezier curves for smooth, snappy animations
    bezier = easeOutQuint, 0.22, 1, 0.36, 1
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = linear, 0, 0, 1, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.1

    # Window animations - smooth and snappy
    animation = windowsIn, 1, 5, easeOutExpo, popin 90%
    animation = windowsOut, 1, 4, easeInOutCubic, popin 90%
    animation = windowsMove, 1, 5, easeOutQuint, slide

    # Fade animations
    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 3, easeInOutCubic
    animation = fadeSwitch, 1, 4, easeOutQuint
    animation = fadeShadow, 1, 4, easeOutQuint
    animation = fadeDim, 1, 3, easeOutQuint
    animation = fadeLayers, 1, 4, easeOutExpo

    # Border animations
    animation = border, 1, 4, easeOutQuint
    animation = borderangle, 1, 100, linear, loop

    # Workspace animations
    animation = workspaces, 1, 5, easeOutExpo, slide
    animation = specialWorkspace, 1, 5, easeOutExpo, slidevert
}

# ================================
# LAYOUT SETTINGS
# ================================
dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    smart_resizing = true
    special_scale_factor = 0.95
    force_split = 0
    default_split_ratio = 1.0
}

master {
    new_status = master
    new_on_top = false
    mfact = 0.55
    orientation = left
    special_scale_factor = 0.95
}

# ================================
# INPUT CONFIGURATION
# ================================
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    mouse_refocus = true
    float_switch_override_focus = 2

    repeat_rate = 30
    repeat_delay = 300

    sensitivity = 0
    accel_profile = flat
    force_no_accel = false

    touchpad {
        natural_scroll = false
        disable_while_typing = true
        clickfinger_behavior = true
        tap-to-click = true
        drag_lock = false
        middle_button_emulation = false
    }
}

# ================================
# CURSOR
# ================================
cursor {
    no_hardware_cursors = false
    no_break_fs_vrr = false
    min_refresh_rate = 60
    hotspot_padding = 1
    inactive_timeout = 0
    no_warps = false
    persistent_warps = false
    warp_on_change_workspace = false
    default_monitor =
    zoom_factor = 1.0
    zoom_rigid = false
    enable_hyprcursor = true
    hide_on_key_press = false
    hide_on_touch = true
}

# ================================
# MISCELLANEOUS
# ================================
misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0

    # Performance
    vfr = true
    vrr = 1

    # Focus
    focus_on_activate = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true

    # Window swallowing
    enable_swallow = true
    swallow_regex = ^(alacritty|kitty|footclient)$
    swallow_exception_regex = ^(wev)$

    # Misc settings
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    disable_autoreload = false

    # Window behavior
    allow_session_lock_restore = true
    close_special_on_empty = true
    # new_window_takes_over_fullscreen = 0
    exit_window_retains_fullscreen = false
    initial_workspace_tracking = 1

    # Layer rules
    layers_hog_keyboard_focus = true

    # Other
    background_color = 0x1e1e2e
    splash_font_family = JetBrainsMono Nerd Font
}

# ================================
# BINDS
# ================================
binds {
    workspace_back_and_forth = false
    allow_workspace_cycles = true
    workspace_center_on = 0
    focus_preferred_method = 0
    ignore_group_lock = false
    movefocus_cycles_fullscreen = true
    disable_keybind_grabbing = false
    window_direction_monitor_fallback = true
}

# ================================
# XWayland
# ================================
xwayland {
    use_nearest_neighbor = true
    force_zero_scaling = false
}

# ================================
# OPENGL
# ================================
opengl {
    nvidia_anti_flicker = true
}


