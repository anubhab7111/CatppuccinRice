##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# ================================
# GENERAL WINDOW RULES
# ================================
windowrulev2 = suppressevent maximize, class:.* # Disable maximize events for tiling consistency

# ================================
# FLOATING WINDOWS
# ================================
windowrulev2 = float, title:^Alacritty Decorated$
windowrulev2 = float, class:^(com.saivert.pwvucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(qalculate-gtk)$
windowrulev2 = float, class:^(kitty)$


# ================================
# OPACITY SETTINGS (Applies to active and inactive state)
# ================================
windowrulev2 = opacity 0.8 0.8, class:^(pavucontrol)$
windowrulev2 = opacity 0.8 0.8, class:^(blueman-manager)$
windowrulev2 = opacity 0.90 0.90, class:^(thunar)$


# ================================
# BLUR SETTINGS (Windows that should NOT be blurred)
# Requires decoration { blur { enabled = true } } to be active globally
# ================================
windowrulev2 = noblur, class:^(firefox)$
windowrulev2 = noblur, class:^(chromium)$
windowrulev2 = noblur, class:^(code)$
windowrulev2 = noblur, class:^(discord)$
windowrulev2 = noblur, class:^(steam)$
windowrulev2 = noblur, class:^(nautilus)$
windowrulev2 = noblur, class:^(com\.rtosta\.zapzap)$
windowrulev2 = noblur, class:^(Alacritty)$


# ================================
# ANIMATION SETTINGS (Per-window/layer animations)
# Using your defined animations from the 'animations' block
# ================================
windowrulev2 = animation windowsIn, class:^(thunar)$ # Use your global windowsIn animation
# layerrule = animation fade, wofi # Fade for centered pop-ups often feels smoother
layerrule = animation popin, wofi # Fade for centered pop-ups often feels smoother
layerrule = animation slide left, mako # Notifications sliding from side
layerrule = animation slide left, swaync-notification-window # Notification center sliding from side
layerrule = animation fade, hyprpaper # Wallpaper transitions
layerrule = animation fade, selection # Text selection feedback

windowrulev2 = bordersize 0, class:firefox
# windowrulev2 = bordersize 0, class:org.kde.okularwindow


